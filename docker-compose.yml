services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: convai
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/convai
      AGENT_URL: ${AGENT_URL:-}
    ports: ["8000:8000"]
    depends_on: [db]

volumes:
  pgdata:
